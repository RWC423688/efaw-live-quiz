<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EFAW Live Quiz – Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400..700&family=Nunito+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="slides.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body>
<header class="top">
  <div class="cross"><svg viewBox="0 0 24 24"><path fill="#0b7a4b" d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg></div>
  <div><h1>EFAW Live Quiz · Trainer</h1><div class="sub">DM Learning</div></div>
  <div class="spacer"></div>
  <div id="nav" class="row" style="display:none">
    <button class="hbtn" data-tab="live" type="button">Live session</button>
    <button class="hbtn" data-tab="present" type="button">Presentation</button>
    <button class="hbtn" data-tab="results" type="button">Results</button>
    <button class="hbtn" data-tab="highfield" type="button">Highfield</button>
    <button class="hbtn" id="out" type="button">Sign out</button>
  </div>
</header>
<main id="app" class="wide"><div class="wait"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></main>

<script type="module">
import { configured, auth, db, signInWithEmailAndPassword, onAuthStateChanged, signOut,
         doc, collection, getDoc, getDocs, setDoc, updateDoc, deleteDoc, onSnapshot } from "./fb.js";
import { $, esc, toast, confirmBox, shuffle, LETTERS, TOPICS, BANK, byId, scoreAnswers, buildRecordPdf, buildCertificatePdf, certFileName, certNumber, PASS_MARK,
         pdfFileName, downloadBlob, qrSvg, joinUrl, setupNotice, fmtDate, isoDate, safeName } from "./common.js";
import { SLIDES } from "./slides.js";
import { buildLasPdf, markPaper, fmtUK } from "./highfield.js";

const app = $("#app");
const ACTIVE = "efaw.live.active";
let user = null, tab = "live";
let code = null, sess = null, players = {}, answers = [], retests = {}, hfAns = {}, unsubs = [];
const HFDEF = "efaw.hf.defaults";
let paperTimer = null;
let topicSel = "balanced";
let liveView = "quiz";                               // "quiz" or "slides" during a live session
let slideIdx = 0, fragShown = 0, showNotes = false, liveMode = false;

/* ---------- Auth ---------- */
if (!configured) app.innerHTML = setupNotice();
else onAuthStateChanged(auth, async u => {
  user = u && !u.isAnonymous ? u : null;
  if (!user){ $("#nav").style.display = "none"; renderLogin(); return; }
  let ok = false;
  try { ok = (await getDoc(doc(db, "trainers", user.uid))).exists(); } catch(e){ console.error(e); }
  if (!ok){ renderNotTrainer(); return; }
  $("#nav").style.display = "";
  go(tab);
});

function renderLogin(err = ""){
  app.innerHTML = `<div class="card" style="max-width:420px;margin:30px auto">
    <h2>Trainer sign in</h2><p class="lead">Use the trainer account set up in Firebase.</p>
    <form id="lf"><label class="f" for="le">Email</label><input type="email" id="le" autocomplete="username">
    <label class="f" for="lp">Password</label><input type="password" id="lp" autocomplete="current-password">
    <div class="err" id="lerr">${esc(err)}</div>
    <button class="btn full" type="submit" id="lb">Sign in</button></form></div>`;
  $("#lf").onsubmit = async e => {
    e.preventDefault(); $("#lb").disabled = true;
    try { await signInWithEmailAndPassword(auth, $("#le").value.trim(), $("#lp").value); }
    catch(e2){ console.error(e2); $("#lerr").textContent = "Sign in failed. Check the email and password."; $("#lb").disabled = false; }
  };
}

function renderNotTrainer(){
  app.innerHTML = `<div class="card" style="max-width:560px;margin:30px auto"><h2>Not set up as a trainer yet</h2>
  <p class="lead">You're signed in, but this account hasn't been added as a trainer. In Firebase, add a document to the <b>trainers</b> collection with this ID (see the setup guide):</p>
  <p style="font-family:ui-monospace,monospace;background:var(--bg);padding:10px;border-radius:8px;word-break:break-all">${esc(auth.currentUser.uid)}</p>
  <div class="actions"><button class="btn ghost" id="so" type="button">Sign out</button><button class="btn" id="rt" type="button">Check again</button></div></div>`;
  $("#so").onclick = () => signOut(auth);
  $("#rt").onclick = () => location.reload();
}

$("#nav").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "out"){ stopLive(); signOut(auth); return; }
  go(b.dataset.tab);
};

function go(t){
  tab = t;
  document.querySelectorAll("#nav [data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  if (t === "results"){ stopLive(); renderResults(); }
  else if (t === "present"){ stopLive(); renderPresent(); }
  else if (t === "highfield"){ stopLive(); renderHighfield(); }
  else {
    let saved = null; try { saved = localStorage.getItem(ACTIVE); } catch(e){}
    if (saved) openLive(saved); else renderCreate();
  }
}

/* ---------- Create session ---------- */
function makeCode(){ const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; return Array.from({ length: 5 }, () => A[Math.floor(Math.random() * A.length)]).join(""); }

function renderCreate(){
  const today = new Date().toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" });
  app.innerHTML = `<div class="card" style="max-width:640px;margin:10px auto">
    <h2>Start a live session</h2>
    <p class="lead">Candidates join on their phones with a code. You push questions to everyone at once, reveal the answers, and send catch-up questions to anyone who got one wrong.</p>
    <label class="f" for="st">Session name</label>
    <input type="text" id="st" value="EFAW course – ${esc(today)}">
    <label class="f">Number of questions</label>
    <div class="seg" id="lenSeg">${[15, 30, 45].map(n => `<button type="button" data-n="${n}" class="${n === 30 ? "on" : ""}">${n} questions</button>`).join("")}</div>
    <p class="mut" style="font-size:13px;margin:8px 0 0">Catch-up questions for wrong answers are extra and don't count towards this number.</p>
    <label class="tog" style="margin-top:18px"><input type="checkbox" id="hfOn"><span><b>Include the Highfield theory paper</b><small>Candidates choose Highfield or DM Learning certificate when they join. Highfield candidates sit a Highfield paper at the end, and you get a completed Learner Answer Sheet for each.</small></span></label>
    <div id="hfBox" hidden class="hfbox">
      <div id="hfPaperPick"><span class="mut">Loading papers…</span></div>
      <div class="hfgrid">
        <label>Course ID<input type="text" id="hfCourse" placeholder="e.g. CQ1084128"></label>
        <label>Date of assessment<input type="date" id="hfDate" value="${new Date().toISOString().slice(0, 10)}"></label>
        <label>Centre name<input type="text" id="hfCentre"></label>
        <label>Centre number<input type="text" id="hfCentreNo"></label>
        <label>Tutor name<input type="text" id="hfTutor"></label>
        <label>Tutor number<input type="text" id="hfTutorNo"></label>
      </div>
    </div>
    <div class="err" id="cerr"></div>
    <div class="actions"><button class="btn big" id="cs" type="button">Create session</button></div></div>`;
  let hfPapers = [];
  const defs = (() => { try { return JSON.parse(localStorage.getItem(HFDEF) || "{}"); } catch(e){ return {}; } })();
  $("#hfCentre").value = defs.centreName || ""; $("#hfCentreNo").value = defs.centreNumber || "";
  $("#hfTutor").value = defs.tutorName || ""; $("#hfTutorNo").value = defs.tutorNumber || "";
  $("#hfOn").onchange = async () => {
    $("#hfBox").hidden = !$("#hfOn").checked;
    if (!$("#hfOn").checked || hfPapers.length) return;
    try {
      const qs = await getDocs(collection(db, "hfPapers")); qs.forEach(d => hfPapers.push(d.data()));
      hfPapers.sort((a, b) => a.code.localeCompare(b.code));
      $("#hfPaperPick").innerHTML = hfPapers.length
        ? `<label class="f" style="margin-top:0">Paper</label><div class="seg" id="hfSeg">${hfPapers.map((p, i) => `<button type="button" data-c="${esc(p.code)}" class="${i === 0 ? "on" : ""}">${esc(p.code)}${p.keyConfirmed ? "" : " (answer key not confirmed)"}</button>`).join("")}</div>`
        : `<p class="err" style="margin:0">No Highfield papers imported yet. Import them in the <b>Highfield</b> tab first.</p>`;
      const seg = $("#hfSeg"); if (seg) seg.onclick = e => { const b = e.target.closest("button"); if (!b) return; [...seg.children].forEach(x => x.classList.toggle("on", x === b)); };
    } catch(e){ console.error(e); $("#hfPaperPick").innerHTML = `<p class="err">Couldn't load the Highfield papers.</p>`; }
  };
  let total = 30;
  $("#lenSeg").onclick = e => { const b = e.target.closest("button"); if (!b) return; total = +b.dataset.n; [...$("#lenSeg").children].forEach(x => x.classList.toggle("on", x === b)); };
  $("#cs").onclick = async () => {
    let hf = null;
    if ($("#hfOn").checked){
      const sel = document.querySelector("#hfSeg .on");
      if (!sel){ $("#cerr").textContent = "Import the Highfield papers in the Highfield tab first, or untick the Highfield paper."; return; }
      hf = { enabled: true, paper: sel.dataset.c, courseId: $("#hfCourse").value.trim(), assessDate: $("#hfDate").value,
             centreName: $("#hfCentre").value.trim(), centreNumber: $("#hfCentreNo").value.trim(), tutorName: $("#hfTutor").value.trim(), tutorNumber: $("#hfTutorNo").value.trim() };
      if (!hf.courseId || !hf.centreName || !hf.tutorName){ $("#cerr").textContent = "Fill in the Course ID, Centre name and Tutor name for the answer sheets."; return; }
      try { localStorage.setItem(HFDEF, JSON.stringify({ centreName: hf.centreName, centreNumber: hf.centreNumber, tutorName: hf.tutorName, tutorNumber: hf.tutorNumber })); } catch(e){}
    }
    $("#cs").disabled = true;
    try {
      let c;
      for (let i = 0; i < 5; i++){ c = makeCode(); if (!(await getDoc(doc(db, "sessions", c))).exists()) break; }
      await setDoc(doc(db, "sessions", c), { code: c, title: $("#st").value.trim() || "EFAW course", createdAt: Date.now(), trainerUid: user.uid,
                                             status: "lobby", q: null, asked: [], retestRound: 0, endedAt: null, total, hf });
      openLive(c);
    } catch(e){ console.error(e); toast("Couldn't create the session. Check your connection."); $("#cs").disabled = false; }
  };
}

/* ---------- Live session ---------- */
function stopLive(){ unsubs.forEach(u => u()); unsubs = []; code = null; sess = null; players = {}; answers = []; retests = {}; hfAns = {}; clearInterval(paperTimer); }

function openLive(c){
  stopLive(); code = c;
  try { localStorage.setItem(ACTIVE, c); } catch(e){}
  const base = ["sessions", c];
  unsubs.push(onSnapshot(doc(db, ...base), s => {
    if (!s.exists()){ try { localStorage.removeItem(ACTIVE); } catch(e){} stopLive(); renderCreate(); return; }
    sess = s.data(); renderLive();
  }, err => { console.error(err); toast("Lost connection to the session"); }));
  unsubs.push(onSnapshot(collection(db, ...base, "players"), qs => { players = {}; qs.forEach(d => players[d.id] = d.data()); renderLive(); }));
  unsubs.push(onSnapshot(collection(db, ...base, "answers"), qs => { answers = []; qs.forEach(d => answers.push(d.data())); renderLive(); }));
  unsubs.push(onSnapshot(collection(db, ...base, "retests"), qs => { retests = {}; qs.forEach(d => retests[d.id] = d.data()); renderLive(); }));
  unsubs.push(onSnapshot(collection(db, ...base, "hfAnswers"), qs => { hfAns = {}; qs.forEach(d => hfAns[d.id] = d.data()); renderLive(); }));
}

const sessRef = () => doc(db, "sessions", code);
const playerIds = () => Object.keys(players).sort((a, b) => (players[a].name || "").localeCompare(players[b].name || ""));
const usedQids = () => new Set([...(sess.asked || []), ...Object.values(retests).flatMap(r => r.qids || [])]);
const remaining = t => BANK.filter(q => (t === "all" || t === "balanced" || q[1] === t) && !usedQids().has(q[0])).length;
const quizDone = () => !!sess.total && (sess.asked || []).length >= sess.total;
const qLabel = n => `Question ${n}${sess.total ? ` of ${sess.total}` : ""}`;

function needsCatchup(){
  // players with a wrong main answer that has no catch-up question yet
  const out = {};
  answers.filter(a => !a.retest && a.choice !== 0 && players[a.uid]).forEach(a => {
    const covered = new Set(((retests[a.uid] || {}).items || []).map(i => i.for));
    if (!covered.has(a.qid)) (out[a.uid] = out[a.uid] || []).push(a.qid);
  });
  return out;
}

function topicSelect(){
  return `<select id="ts">${[["balanced", "Balanced mix of all topics"], ["all", "Any topic (random)"], ...Object.entries(TOPICS)].map(([k, v]) =>
    `<option value="${k}" ${k === topicSel ? "selected" : ""}>${esc(v)} (${remaining(k)} left)</option>`).join("")}</select>`;
}

function joinPanel(){
  const url = joinUrl(code);
  return `<div class="join"><div class="qr" id="qrBox" title="Click to show full screen" style="cursor:pointer">${qrSvg(url)}</div>
    <div><div class="mut" style="font-size:18px">Join on your phone: scan the code, or go to</div>
    <div class="url">${esc(url.split("?")[0])}</div>
    <div class="mut" style="font-size:18px;margin-top:10px">and enter</div><div class="codebig">${esc(code)}</div></div></div>`;
}

function peopleChips(qid){
  const ids = playerIds();
  if (!ids.length) return `<p class="mut">Nobody has joined yet.</p>`;
  return `<div class="people">${ids.map(id => {
    let cls = "";
    if (qid){ const a = answers.find(x => x.uid === id && x.qid === qid); if (a) cls = sess.status === "reveal" ? (a.choice === 0 ? "yes" : "no") : "yes"; }
    return `<span class="person ${cls}">${esc(players[id].name)}${players[id].track === "highfield" ? `<span class="hfpill" title="Highfield qualification">H</span>` : ""}</span>`;
  }).join("")}</div>`;
}

function renderLive(){
  if (tab !== "live" || !sess) return;
  const st = sess.status, n = playerIds().length;
  let stage = "", controls = "";
  const askBtn = quizDone()
    ? `<span class="mut" style="font-size:16px">All ${sess.total} questions asked.</span><button class="btn big" id="finishQuiz" type="button">Finish quiz</button>`
    : `${topicSelect()}<button class="btn big" id="ask" type="button">${sess.q ? "Next question" : "Ask first question"}</button>`;

  const hfCount = playerIds().filter(id => players[id].track === "highfield").length;
  const hfBtn = sess.hf && sess.hf.enabled
    ? (sess.paperStartedAt ? `<span class="mut" style="font-size:14px">Highfield paper finished ✓</span>`
                           : `<button class="btn big hfbtn" id="startPaper" type="button">Start Highfield paper (${hfCount})</button>`) : "";
  if (st === "lobby" || st === "wait"){
    stage = `<div class="stage">${joinPanel()}<h3 style="margin-top:24px">${n} joined${sess.hf && sess.hf.enabled ? ` · ${hfCount} taking Highfield <span class="hfpill">H</span>` : ""}</h3>${peopleChips(null)}</div>`;
    controls = askBtn + hfBtn;
  }
  else if (st === "paper"){
    const ids = playerIds().filter(id => players[id].track === "highfield");
    const sub = ids.filter(id => hfAns[id] && hfAns[id].submitted).length;
    stage = `<div class="stage">
      <div class="row" style="justify-content:space-between"><span class="hfbadge">Highfield theory paper · ${esc(sess.hf.paper)}</span><span class="ptimer" id="ptimer"></span></div>
      <h2 style="margin-top:14px">Theory paper in progress</h2>
      <p class="lead">Highfield candidates are answering paper ${esc(sess.hf.paper)} on their phones, unaided. Other candidates have been asked to wait quietly. Allow a minimum of 25 minutes.</p>
      <div class="statusbar"><span class="big-count">${sub}<span style="font-size:24px;color:var(--mut)"> / ${ids.length}</span></span><span class="mut">submitted</span></div>
      ${ids.length ? `<table style="margin-top:12px"><thead><tr><th>Candidate</th><th class="num">Answered</th><th>Status</th></tr></thead><tbody>${ids.map(id => {
        const a = hfAns[id], cnt = a ? Object.values(a.answers || {}).filter(Boolean).length : 0;
        return `<tr><td>${esc(players[id].name)}</td><td class="num">${cnt} / 15</td><td>${a && a.submitted ? `<span class="result pass" style="margin:0;font-size:12px">Submitted</span>` : cnt ? "In progress" : `<span class="mut">Not started</span>`}</td></tr>`; }).join("")}</tbody></table>`
        : `<p class="mut">No candidates chose the Highfield qualification.</p>`}</div>`;
    controls = `<button class="btn big" id="endPaper" type="button">End paper</button>`;
  }
  else if (st === "question" || st === "reveal"){
    const qid = sess.q.qid, q = byId[qid], reveal = st === "reveal";
    const qa = answers.filter(a => a.qid === qid && !a.retest && players[a.uid]);
    const counts = [0,1,2,3].map(o => qa.filter(a => a.choice === o).length);
    const max = Math.max(1, ...counts);
    stage = `<div class="stage">
      <div class="row" style="justify-content:space-between"><span class="chip">${esc(TOPICS[q[1]])}</span><span class="mut">${qLabel(sess.q.n)}</span></div>
      <div class="sq">${esc(q[2])}</div>
      <div class="sopts">${sess.q.order.map((o, k) => `<div class="sopt ${reveal ? (o === 0 ? "right" : "dim") : ""}">
        ${reveal ? `<div class="fill" style="width:${counts[o] / max * 100}%"></div>` : ""}
        <span class="k">${LETTERS[k]}</span><span>${esc(q[3][o])}</span>${reveal ? `<span class="cnt">${counts[o]}</span>` : ""}</div>`).join("")}</div>
      ${reveal ? `<div class="explain"><b>${esc(q[3][0])}.</b> ${esc(q[4])}</div>` : ""}
      <div class="statusbar"><span class="big-count">${qa.length}<span style="font-size:24px;color:var(--mut)"> / ${n}</span></span><span class="mut">answered${reveal ? ` · ${counts[0]} correct` : ""}</span></div>
      ${peopleChips(qid)}</div>`;
    if (!reveal) controls = `<button class="btn big" id="reveal" type="button">Reveal answer</button>`;
    else {
      const need = needsCatchup(), k = Object.keys(need).length;
      controls = askBtn + `<button class="btn big ghost" id="catch" type="button" ${k ? "" : "disabled"}>Send catch-up questions${k ? ` (${k})` : ""}</button>` + hfBtn;
    }
  }
  else if (st === "retest"){
    const ids = playerIds().filter(id => (retests[id] || {}).items && retests[id].items.some(i => i.round === sess.retestRound));
    stage = `<div class="stage"><h2>Catch-up round</h2><p class="lead">Candidates who got a question wrong are answering a different question on the same topic on their phones.</p>
      ${ids.length ? `<table><thead><tr><th>Candidate</th><th>Topics</th><th class="num">Answered</th><th class="num">Correct</th></tr></thead><tbody>
      ${ids.map(id => {
        const items = retests[id].items.filter(i => i.round === sess.retestRound);
        const got = items.map(i => answers.find(a => a.uid === id && a.qid === i.qid)).filter(Boolean);
        return `<tr><td>${esc(players[id].name)}</td><td>${esc([...new Set(items.map(i => TOPICS[byId[i.qid][1]]))].join(", "))}</td>
          <td class="num">${got.length} / ${items.length}</td><td class="num">${got.filter(a => a.choice === 0).length}</td></tr>`;
      }).join("")}</tbody></table>` : `<p class="mut">No catch-up questions this round.</p>`}</div>`;
    controls = `<button class="btn big" id="finishCatch" type="button">Finish catch-up</button>`;
  }
  else if (st === "ended"){
    app.innerHTML = `<div class="card done"><div class="tick"><svg viewBox="0 0 24 24"><path fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>Session ended</h2><p class="lead">${esc(sess.title)} · ${n} candidates. Their results are in the Results tab.</p>
      <div class="actions" style="justify-content:center"><button class="btn ghost" id="newS" type="button">Start another session</button><button class="btn" id="toRes" type="button">View results</button></div></div>`;
    $("#newS").onclick = () => { try { localStorage.removeItem(ACTIVE); } catch(e){} stopLive(); renderCreate(); };
    $("#toRes").onclick = () => { const c = code; try { localStorage.removeItem(ACTIVE); } catch(e){} stopLive(); tab = "results";
      document.querySelectorAll("#nav [data-tab]").forEach(b => b.classList.toggle("on", b.dataset.tab === "results")); openResult(c); };
    return;
  }

  const top = `<div class="topbar"><span class="t">${esc(sess.title)}</span><span class="c">${esc(code)}</span>
      <span class="mut">${n} candidate${n === 1 ? "" : "s"} · ${sess.total ? `${(sess.asked || []).length} of ${sess.total} questions asked` : `${(sess.asked || []).length} question${(sess.asked || []).length === 1 ? "" : "s"} asked`}</span>
      <span style="flex:1"></span>
      <div class="viewtoggle"><button data-v="slides" class="${liveView === "slides" ? "on" : ""}" type="button">Slides</button><button data-v="quiz" class="${liveView === "quiz" ? "on" : ""}" type="button">Quiz</button></div>
      <button class="btn ghost" id="showJoin" type="button">Show join code</button>
      <button class="btn danger" id="end" type="button">End session</button></div>`;
  if (!$("#liveShell") || $("#liveShell").dataset.code !== code)
    app.innerHTML = `<div id="liveShell" data-code="${esc(code)}"><div id="liveTop"></div><div id="liveBody"></div></div>`;
  $("#liveTop").innerHTML = top;
  if (liveView === "slides"){
    if (!$("#liveBody .player")) mountPlayer($("#liveBody"), true); else updateLiveButton();
  } else {
    const toSlides = st === "question" || st === "paper" ? "" : `<button class="btn big ghost" id="toSlides" type="button">${st === "lobby" && !sess.q ? "Start presentation" : "Back to slides"}</button>`;
    $("#liveBody").innerHTML = `${stage}<div class="controls">${controls}${toSlides}</div>`;
  }
  wireLive();
}

function setLiveView(v){
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  liveView = v; const b = $("#liveBody"); if (b) b.innerHTML = ""; renderLive();
}

function paperClock(){
  clearInterval(paperTimer);
  const el = () => $("#ptimer");
  if (!sess || sess.status !== "paper" || !el()) return;
  const tickF = () => {
    const t = el(); if (!t || !sess || sess.status !== "paper"){ clearInterval(paperTimer); return; }
    const secs = Math.max(0, Math.floor((Date.now() - sess.paperStartedAt) / 1000));
    const mm = String(Math.floor(secs / 60)).padStart(2, "0"), ss = String(secs % 60).padStart(2, "0");
    t.textContent = `${mm}:${ss} elapsed${secs < 1500 ? " · minimum 25:00" : " · minimum time reached"}`;
    t.classList.toggle("ok", secs >= 1500);
  };
  tickF(); paperTimer = setInterval(tickF, 1000);

async function loadTemplates(){

  return t;

function pickTemplate(tpls, code){ return tpls[code] || tpls.EFAW22309 || Object.values(tpls)[0] || null; }
async function pdfToBase64(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  if (String.fromCharCode(...buf.slice(0, 5)) !== "%PDF-") throw new Error("not a pdf");
  let bin = ""; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode(...buf.subarray(i, i + 0x8000));
  return btoa(bin);
}

function fitSlide(){
  const st = $("#pstage"), d = $("#pdeck"); if (!st || !d) return;
  const fs = document.fullscreenElement === st;
  const w = fs ? window.innerWidth : st.clientWidth, h = fs ? window.innerHeight : w * 1080 / 1920;
  const sc = Math.min(w / 1920, h / 1080);
  d.style.transform = `scale(${sc})`;
  d.style.left = fs ? (w - 1920 * sc) / 2 + "px" : "0"; d.style.top = fs ? (h - 1080 * sc) / 2 + "px" : "0";
  if (!fs) st.style.height = 1080 * sc + "px";
}
window.addEventListener("resize", fitSlide);
document.addEventListener("fullscreenchange", () => { fitSlide(); const h = $("#pfsHint"); if (h) h.hidden = !document.fullscreenElement; });

function showSlide(){
  const d = $("#pdeck"); if (!d) return;
  slideIdx = Math.max(0, Math.min(SLIDES.length - 1, slideIdx));
  const s = SLIDES[slideIdx];
  d.innerHTML = s.html; fragShown = 0; fitSlide();
  $("#pCount").textContent = `${slideIdx + 1} / ${SLIDES.length}`;
  const opts = [...$("#pJump").options]; let sel = opts[0];
  opts.forEach(o => { if (+o.value <= slideIdx) sel = o; }); $("#pJump").value = sel.value;
  $("#pNotesBox").innerHTML = s.notes ? `<b>Speaker notes</b>${esc(s.notes)}` : `<b>Speaker notes</b><span class="mut">None for this slide.</span>`;
  $("#pPrev").disabled = slideIdx === 0;
  updateLiveButton();
}
function frags(){ return [...document.querySelectorAll("#pdeck .fragment")]; }
function nextSlide(){
  const f = frags();
  if (fragShown < f.length){ f[fragShown++].classList.add("visible"); return; }
  if (slideIdx < SLIDES.length - 1){ slideIdx++; showSlide(); }
}
function prevSlide(){ if (slideIdx > 0){ slideIdx--; showSlide(); } }
function goSlide(i){ slideIdx = i; showSlide(); }

function updateLiveButton(){
  const el = $("#pLive"); if (!el) return;
  const s = SLIDES[slideIdx];
  if (!liveMode || !sess || sess.status === "ended" || !s){ el.innerHTML = ""; return; }

  if (quizDone()){ el.innerHTML = `<span class="mut" style="font-size:14px">All ${sess.total} questions asked</span>`; return; }
  const busy = sess.status === "question" || sess.status === "retest" || sess.status === "paper";

  el.innerHTML = `<button class="pbtn live" id="pAsk" type="button" ${busy ? "disabled" : ""} title="Shortcut: Q">▶ ${esc(label)}</button>`;
  $("#pAsk").onclick = async () => {

    else { topicSel = "balanced"; setLiveView("quiz"); }
  };
}

document.addEventListener("keydown", e => {
  if (!$("#pdeck") || e.target.closest("input, select, textarea") || $(".modal")) return;
  if (["ArrowRight", "PageDown", " ", "Enter"].includes(e.key)){ e.preventDefault(); nextSlide(); }
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)){ e.preventDefault(); prevSlide(); }

async function askQuestion(){
  if (quizDone()){ toast(`All ${sess.total} questions have been asked.`); return; }
  const used = usedQids();
  let pool;
  if (topicSel === "balanced"){
    // pick from the topic(s) asked least so far that still have unused questions
    const count = {}; Object.keys(TOPICS).forEach(t => count[t] = 0);
    (sess.asked || []).forEach(id => { if (byId[id]) count[byId[id][1]]++; });
    const avail = Object.keys(TOPICS).filter(t => BANK.some(q => q[1] === t && !used.has(q[0])));
    const min = Math.min(...avail.map(t => count[t]));
    const tops = avail.filter(t => count[t] === min);
    const t = tops[Math.floor(Math.random() * tops.length)];
    pool = BANK.filter(q => q[1] === t && !used.has(q[0]));
  } else {
    pool = BANK.filter(q => (topicSel === "all" || q[1] === topicSel) && !used.has(q[0]));
  }
  if (!pool || !pool.length){ toast("No unused questions left in that topic. Pick another."); return; }
  const q = pool[Math.floor(Math.random() * pool.length)];
  const asked = [...(sess.asked || []), q[0]];
  await updateDoc(sessRef(), { status: "question", q: { qid: q[0], order: shuffle([0,1,2,3]), n: asked.length, at: Date.now() }, asked }).catch(err);
}

async function sendCatchup(){
  const need = needsCatchup();
  const round = (sess.retestRound || 0) + 1;
  const used = usedQids();
  const givenNow = new Set();
  let sent = 0, short = 0;
  for (const [uid, wrong] of Object.entries(need)){
    const ex = retests[uid] || { items: [], qids: [] };
    const items = [];
    for (const qid of wrong){
      const topic = byId[qid][1];
      const pool = BANK.filter(q => q[1] === topic && !used.has(q[0]) && !items.some(i => i.qid === q[0]));
      if (!pool.length){ short++; continue; }
      const fresh = pool.filter(q => !givenNow.has(q[0]));   // spread questions across candidates where possible
      const pick = (fresh.length ? fresh : pool)[Math.floor(Math.random() * (fresh.length ? fresh : pool).length)];
      givenNow.add(pick[0]);
      items.push({ qid: pick[0], order: shuffle([0,1,2,3]), for: qid, round });
    }
    if (!items.length) continue;
    try {
      await setDoc(doc(db, "sessions", code, "retests", uid), { items: [...(ex.items || []), ...items], qids: [...(ex.qids || []), ...items.map(i => i.qid)], round });
      sent++;
    } catch(e){ console.error(e); }
  }
  if (!sent){ toast(short ? "No unused questions left in those topics for catch-up." : "Nobody needs a catch-up question."); return; }
  await updateDoc(sessRef(), { status: "retest", retestRound: round }).catch(err);
  if (short) toast(`${short} catch-up question(s) couldn't be sent: no unused questions left in that topic.`);
}

      <h2 style="margin-top:6px">${esc(s.title)}</h2><div class="mut">${esc(fmtDate(s.createdAt))} · code ${esc(s.code)} · ${rows.length} candidates · ${(s.asked || []).length}${s.total ? ` of ${s.total}` : ""} questions asked · ${s.status === "ended" ? "Ended" : "Still live"}</div></div>
      <div class="row"><button class="btn ghost" id="csv" type="button">Export CSV</button><button class="btn" id="zip" type="button" ${rows.length ? "" : "disabled"}>Download all PDFs</button></div></div>
    ${hfOn ? `<div class="hfinfo"><span class="hfbadge">Highfield</span> Paper <b>${esc(s.hf.paper)}</b> · Course ID ${esc(s.hf.courseId || "–")} · assessed ${esc(fmtUK(s.hf.assessDate))} · ${rows.filter(isHFrow).length} Highfield candidate${rows.filter(isHFrow).length === 1 ? "" : "s"}
      ${keyOk ? (rows.filter(isHFrow).length ? ` · <b>${rows.filter(r => r.hfm && r.hfm.mark >= 11).length} pass</b>, ${rows.filter(r => isHFrow(r) && !(r.hfm && r.hfm.mark >= 11)).length} refer` : "")
              : `<div class="err" style="margin-top:6px">The answer key for ${esc(s.hf.paper)} hasn't been confirmed, so papers can't be marked yet. Confirm it in the <b>Highfield</b> tab.</div>`}
      ${tpl ? "" : `<div class="err" style="margin-top:6px">No Learner Answer Sheet has been uploaded. Upload it in the <b>Highfield</b> tab.</div>`}</div>` : ""}
    <div class="row" style="margin-top:12px;gap:8px"><span class="result pass" style="margin:0">${dmRows.filter(r => r.sc.passed).length} passed</span><span class="result fail" style="margin:0">${dmRows.filter(r => !r.sc.passed).length} not passed</span><span class="mut" style="font-size:13px">DM Learning certificate: pass mark ${PASS_MARK}% of the main quiz questions (catch-ups not counted).</span></div>
    <table style="margin-top:16px"><thead><tr><th>Candidate</th><th class="num">Quiz score</th><th>Quiz result</th><th class="num">Catch-up</th>${hfOn ? `<th>Highfield paper</th>` : ""}<th></th></tr></thead><tbody>
    ${rows.map((r, i) => `<tr><td><b>${esc(r.name)}</b></td>
      <td class="num">${r.sc.main.c}/${r.sc.main.n} (${r.sc.main.pct}%)<span class="mini"><div style="width:${r.sc.main.pct}%;background:${col(r.sc.main.pct)}"></div></span></td>
      <td>${isHFrow(r) ? `<span class="mut" style="font-size:13px">Practice</span>` : r.sc.main.n ? (r.sc.passed ? `<span class="result pass" style="margin:0;font-size:13px">Pass</span>` : `<span class="result fail" style="margin:0;font-size:13px">Not passed</span>`) : `<span class="mut">–</span>`}</td>
      <td class="num">${r.sc.catchup.n ? `${r.sc.catchup.c}/${r.sc.catchup.n}` : "–"}</td>
      ${hfOn ? `<td>${hfCell(r)}</td>` : ""}
      <td class="num"><button class="link" data-v="${i}" type="button">Details</button> · <button class="link" data-p="${i}" type="button">Results PDF</button>${r.sc.passed && !isHFrow(r) ? ` · <button class="link" data-c="${i}" type="button">Certificate</button>` : ""}${isHFrow(r) && r.hfa ? ` · <button class="link" data-l="${i}" type="button">Answer sheet</button>` : ""}</td></tr>
      <tr id="det${i}" style="display:none"><td colspan="${hfOn ? 6 : 5}">${detail(r)}</td></tr>`).join("") || `<tr><td colspan="5" class="mut">No candidates joined.</td></tr>`}
    </tbody></table>
    <div class="actions"><button class="btn danger" id="del" type="button">Delete session</button></div></div>`;
  $("#back").onclick = renderResults;
  app.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { const d = $("#det" + b.dataset.v); d.style.display = d.style.display ? "" : "none"; });
  app.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { const r = rows[+b.dataset.p]; downloadBlob(pdfFor(r), pdfFileName(r.name, when)); });
  app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => { const r = rows[+b.dataset.c]; downloadBlob(certFor(r), certFileName(r.name, when)); });
  app.querySelectorAll("[data-l]").forEach(b => b.onclick = async () => {
    const r = rows[+b.dataset.l];
    if (!lasReady()) return;
    try { downloadBlob(await lasFor(r), lasName(r)); } catch(e){ console.error(e); toast("Couldn't build the answer sheet."); }
  });
  $("#csv").onclick = () => downloadBlob(new Blob(["\ufeff" + csvFor(s, rows, hfOn ? { keyOk, isHFrow } : null)], { type: "text/csv" }), `EFAW Results - ${safeName(s.title)} - ${isoDate(when)}.csv`);
  $("#zip").onclick = async () => {
    if (!window.JSZip){ toast("Zip library didn't load. Use the PDF links instead."); return; }
    const z = new window.JSZip();
    rows.forEach(r => z.file("Results/" + pdfFileName(r.name, when), pdfFor(r)));
    rows.filter(r => r.sc.passed && !isHFrow(r)).forEach(r => z.file("Certificates/" + certFileName(r.name, when), certFor(r)));
    if (hfOn && keyOk && tpl){ for (const r of rows.filter(r => isHFrow(r) && r.hfa)) z.file("Highfield answer sheets/" + lasName(r), await lasFor(r)); }
    else if (hfOn && rows.some(isHFrow)) toast("Highfield answer sheets weren't included: confirm the answer key and upload the answer sheet PDF first.");
    downloadBlob(await z.generateAsync({ type: "blob" }), `EFAW Results - ${safeName(s.title)} - ${isoDate(when)}.zip`);
  };
  $("#del").onclick = async () => {
    if (!(await confirmBox("Delete this session?", `This permanently deletes "${s.title}" and all ${rows.length} candidates' results. It can't be undone. Export anything you need first.`, "Delete permanently"))) return;
    try {
      const base = ["sessions", c];
      for (const sub of ["answers", "players", "retests", "hfAnswers", "hf"]){
        const qs = await getDocs(collection(db, ...base, sub));
        for (const d of qs.docs) await deleteDoc(d.ref);
      }
      await deleteDoc(doc(db, ...base));
      try { if (localStorage.getItem(ACTIVE) === c) localStorage.removeItem(ACTIVE); } catch(e){}
      toast("Session deleted"); renderResults();
    } catch(e){ console.error(e); toast("Couldn't delete everything. Try again."); }
  };
  function pdfFor(r){ return buildRecordPdf({ name: r.name, sessionTitle: s.title, completedAt: when, answers: r.list }); }
  function lasReady(){
    if (!keyOk){ toast(`Confirm the answer key for ${s.hf.paper} in the Highfield tab first.`); return false; }
    if (!tpl){ toast("Upload the Learner Answer Sheet PDF in the Highfield tab first."); return false; }
    if (!window.PDFLib){ toast("The PDF library didn't load. Check your connection and reload."); return false; }
    return true;
  }
  function lasName(r){ return `LAS - ${safeName(r.name)} - ${s.hf.paper}.pdf`; }
  function lasFor(r){
    return buildLasPdf({ templateB64: tpl.pdfBase64, templatePaperCode: tpl.paperCode, paperCode: s.hf.paper, passMark: 11, key: paper.key,
      answers: (r.hfa && r.hfa.answers) || {},
      fields: { courseId: s.hf.courseId, assessDate: fmtUK(s.hf.assessDate), centreName: s.hf.centreName, centreNumber: s.hf.centreNumber,
                tutorName: s.hf.tutorName, tutorNumber: s.hf.tutorNumber, learnerName: r.name, dob: fmtUK(r.dob) } });
  }
  function certFor(r){ return buildCertificatePdf({ name: r.name, sessionTitle: s.title, completedAt: when, scorePct: r.sc.main.pct,
    correct: r.sc.main.c, total: r.sc.main.n, certNo: certNumber(s.code, r.uid) }); }
}

function detail(r){
  if (!r.sc.answers.length) return `<span class="mut">No answers.</span>`;
  return `<div style="font-size:13px">${r.sc.answers.map(a => { const q = byId[a.qid]; const ok = a.choice === 0;
    return `<div style="padding:5px 0;border-bottom:1px dashed var(--line)"><span style="color:${ok ? "var(--green)" : "var(--red)"};font-weight:700">${ok ? "Correct" : "Wrong"}</span>
      ${a.retest ? `<span class="chip re">catch-up</span>` : ""} ${esc(q[2])}${ok ? "" : `<div class="mut">Answered: ${esc(q[3][a.choice])} · Correct: ${esc(q[3][0])}</div>`}</div>`; }).join("")}</div>`;
}

function csvFor(s, rows, hfo){
  const tk = Object.keys(TOPICS);
  const cell = v => { const t = String(v ?? ""); return /[",\n]/.test(t) ? `"${t.replace(/"/g, '""')}"` : t; };
  const isHF = r => !!(hfo && hfo.isHFrow(r));
  const hfHead = hfo ? ["Certificate route", "Highfield paper", "Highfield answers (Q1-15)", "Highfield MCQ mark", "Highfield result", "Paper submitted"] : [];
  const head = ["Candidate", "Session", "Date", ...hfHead, "Quiz result", "Quiz score %", "Main correct", "Main answered", "Catch-up correct", "Catch-up answered", "DM certificate no.", ...tk.map(t => TOPICS[t])];
  const lines = rows.map(r => {
    const hfCols = !hfo ? [] : isHF(r)
      ? ["Highfield", s.hf.paper, Array.from({ length: 15 }, (_, i) => ((r.hfa && r.hfa.answers) || {})[i + 1] || "-").join(" "),
         r.hfm ? r.hfm.mark : (r.hfa ? "key not confirmed" : ""), r.hfm ? (r.hfm.mark >= 11 ? "PASS" : "REFER") : "", r.hfa && r.hfa.submitted ? "Yes" : (r.hfa ? "No" : "")]
      : ["DM Learning", "", "", "", "", ""];
    return [r.name, s.title, isoDate(s.endedAt || s.createdAt), ...hfCols,
      isHF(r) ? "Practice" : (r.sc.main.n ? (r.sc.passed ? "Pass" : "Not passed") : ""), r.sc.main.pct, r.sc.main.c, r.sc.main.n, r.sc.catchup.c, r.sc.catchup.n,
      r.sc.passed && !isHF(r) ? certNumber(s.code, r.uid) : "",
      ...tk.map(t => r.sc.byT[t] ? `${r.sc.byT[t].c}/${r.sc.byT[t].n}` : "")];
  });
  return [head, ...lines].map(l => l.map(cell).join(",")).join("\r\n");
}
</script>
</body>
</html>
